<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#073c31"><link rel="manifest" href="manifest.webmanifest"><title>Master Fértil — O Caminho da Alimentação</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#071a16;color:#fff;touch-action:none}button{font:inherit}.screen{position:fixed;inset:0}.hidden{display:none!important}
#start{background:radial-gradient(circle at 50% 30%,#17684f,#061a16 70%);display:grid;place-items:center;padding:18px}.card{width:min(900px,96vw);background:#0a2d25e8;border:2px solid #62e5bb;border-radius:28px;padding:22px;box-shadow:0 24px 80px #0009;text-align:center}.logo{font-size:clamp(28px,5vw,54px);font-weight:900}.sub{opacity:.85;margin:4px 0 18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{border:3px solid transparent;border-radius:22px;background:#123f35;padding:8px;cursor:pointer;color:white}.choice.sel{border-color:#ffd34e;box-shadow:0 0 25px #ffd34e66}.choice img{height:min(44vh,420px);max-width:100%;object-fit:contain}.choice b{display:block;font-size:22px}.go{margin-top:18px;border:0;border-radius:999px;padding:14px 28px;background:#ffd34e;color:#20321d;font-weight:900;font-size:18px;cursor:pointer}
#game{background:#000}.scene{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;transition:filter .3s}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0002,#0000 45%,#0005);pointer-events:none}.hud{position:absolute;z-index:20;left:14px;top:14px;display:flex;gap:10px;align-items:center;background:#063c34dd;border:2px solid #55e6c1;border-radius:20px;padding:8px 14px;box-shadow:0 8px 30px #0008}.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#0a1714}.stats b{font-size:20px}.coins{color:#ffd84c;font-weight:900}.zone{position:absolute;z-index:20;right:14px;top:14px;background:#063c34dd;border:2px solid #fff8;border-radius:18px;padding:10px 15px;font-weight:800}.help{position:absolute;z-index:20;right:14px;top:70px;background:#063c34dd;border-radius:15px;padding:8px 12px;font-size:13px}.player{position:absolute;z-index:12;width:90px;height:110px;object-fit:contain;filter:drop-shadow(0 10px 5px #0007);mix-blend-mode:screen;transform:translate(-50%,-75%);transition:none}.walking{animation:bob .25s infinite alternate}@keyframes bob{to{transform:translate(-50%,-78%) scale(1.02)}}
.object{position:absolute;z-index:8;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#083c31dd;border:2px solid #fff9;box-shadow:0 4px 18px #0008;transform:translate(-50%,-50%)}.object.done{opacity:.35;filter:grayscale(1)}.prompt{position:absolute;z-index:30;left:50%;bottom:115px;transform:translateX(-50%);background:#071d19e8;border:2px solid #fff;border-radius:14px;padding:10px 16px;font-weight:800;display:none}.controls{position:absolute;z-index:25;left:20px;bottom:20px;width:150px;height:150px}.pad button{position:absolute;width:52px;height:52px;border-radius:50%;border:2px solid #fff8;background:#0a2b25cc;color:#fff;font-size:24px}.up{left:49px;top:0}.down{left:49px;bottom:0}.left{left:0;top:49px}.right{right:0;top:49px}.actions{position:absolute;z-index:25;right:20px;bottom:25px;display:flex;gap:12px}.actions button{width:78px;height:78px;border-radius:50%;border:3px solid #fff;background:#0a2b25dd;color:#fff;font-weight:900}.actions .interact{background:#0d7b5fdd}.toast{position:absolute;z-index:50;left:50%;top:20%;transform:translateX(-50%);background:#052f27ed;border:2px solid #ffd34e;border-radius:18px;padding:14px 20px;font-weight:800;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.modal{position:absolute;z-index:60;inset:0;background:#0009;display:grid;place-items:center;padding:16px}.modalbox{width:min(620px,94vw);background:#0b3229;border:2px solid #58e7be;border-radius:24px;padding:22px;box-shadow:0 20px 80px #000}.modalbox h2{margin-top:0}.answers{display:grid;gap:10px}.answers button{padding:13px;border-radius:13px;border:1px solid #ffffff55;background:#174a3e;color:#fff;text-align:left;cursor:pointer}.answers button:hover{background:#216552}.next{margin-top:15px;padding:12px 18px;border:0;border-radius:12px;background:#ffd34e;font-weight:900}.progress{position:absolute;z-index:20;left:50%;top:16px;transform:translateX(-50%);background:#063c34dd;border-radius:16px;padding:9px 14px;font-size:13px}.sound{position:absolute;z-index:25;right:14px;bottom:120px;width:46px;height:46px;border-radius:50%;border:1px solid #fff8;background:#062d26dd;color:#fff;font-size:20px}.mapbar{position:absolute;z-index:26;right:14px;top:112px;display:flex;gap:7px;flex-wrap:wrap;max-width:360px;justify-content:flex-end}.mapbar button{border:1px solid #fff8;background:#063c34e8;color:#fff;border-radius:999px;padding:8px 11px;font-weight:800;cursor:pointer}.mapbar button.active{background:#ffd34e;color:#173326}.coinobj{background:#6b4a00dd!important;border-color:#ffd34e!important}.coinpop{position:absolute;z-index:40;color:#ffd84c;font-weight:1000;font-size:22px;animation:coinup .8s forwards;pointer-events:none}@keyframes coinup{to{transform:translate(-50%,-120px);opacity:0}}@media(max-width:700px){.choice img{height:32vh}.hud{transform:scale(.85);transform-origin:top left}.progress{top:85px}.help{display:none}.player{width:72px;height:92px}.controls{width:135px;height:135px}.actions button{width:66px;height:66px}.zone{font-size:13px}}
</style></head><body>
<section id="start" class="screen"><div class="card"><div class="logo">🌿 Master Fértil</div><div class="sub">O Caminho da Alimentação • escolha seu personagem</div><div class="choices"><button class="choice sel" data-char="theo"><img src="assets/theo_full.png"><b>THEO</b></button><button class="choice" data-char="maya"><img src="assets/maya_full.png"><b>MAYA</b></button></div><button id="go" class="go">ENTRAR NO MUNDO ▶</button></div></section>
<section id="game" class="screen hidden"><div id="scene" class="scene"></div><div class="hud"><img id="avatar" class="avatar"><div class="stats"><b id="name">Theo</b><div>❤️❤️❤️ &nbsp; <span class="coins">🪙 <span id="coins">0</span></span></div></div></div><div class="progress" id="progress">Desafios 0/8 • Cristais 0/5</div><div class="zone" id="zone">🌿 Jardim</div><div class="mapbar" id="mapbar"></div><div class="help">Setas/WASD ou controle • E/Enter para interagir</div><img id="player" class="player"><div id="objects"></div><div id="prompt" class="prompt">E • Interagir</div><div class="controls pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="right" data-dir="right">▶</button><button class="down" data-dir="down">▼</button></div><div class="actions"><button class="interact" id="interact">💬<br>Interagir</button><button id="run">🏃<br>Correr</button></div><button id="sound" class="sound">🔊</button><div id="toast" class="toast"></div><div id="modal" class="modal hidden"><div class="modalbox"><h2 id="qtitle">Desafio</h2><p id="qtext"></p><div id="answers" class="answers"></div><button id="closeModal" class="next hidden">Continuar</button></div></div></section>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let char='theo',x=50,y=72,dir='down',frame=0,coins=0,crystals=0,solved=0,running=false,soundOn=true,zoneIndex=0,near=null;let keys=new Set(),last=performance.now(),walkAcc=0,audioStarted=false;
const zones=[{name:'🌿 Jardim',bg:'assets/jardim.png'},{name:'🛒 Mercado',bg:'assets/mercado.png'},{name:'🍳 Cozinha',bg:'assets/cozinha.png'},{name:'✨ Portal Final',bg:'assets/portal.png'}];
const questions=[
['Fibras e intestino','Qual opção é uma boa fonte de fibras?',['Frutas, verduras e grãos integrais','Refrigerante','Açúcar refinado'],0],
['Variedade alimentar','Um prato variado tende a oferecer…',['Diferentes nutrientes','Somente proteína','Somente gordura'],0],
['Hidratação','Qual bebida é a principal escolha para hidratação diária?',['Água','Refrigerante','Bebida açucarada'],0],
['Folato','O folato está associado principalmente a…',['Síntese celular e formação de tecidos','Dar cor aos alimentos','Substituir a água'],0],
['Proteínas','Qual grupo pode fornecer proteínas?',['Ovos, feijões, peixes e carnes','Balas','Refrigerantes'],0],
['Gorduras','Qual é exemplo de fonte de gorduras insaturadas?',['Castanhas e sementes','Açúcar','Sal'],0],
['Escolha consciente','Uma alimentação equilibrada valoriza…',['Variedade, equilíbrio e alimentos in natura','Um único alimento sempre','Excluir água'],0],
['Planejamento','Ao montar uma refeição, é útil…',['Combinar grupos alimentares','Escolher só doces','Ignorar variedade'],0]];
const objectSets=[
[{x:28,y:42,t:'❓',kind:'quiz'},{x:66,y:34,t:'💡',kind:'quiz'},{x:78,y:63,t:'💎',kind:'crystal'},{x:44,y:58,t:'💎',kind:'crystal'},{x:88,y:46,t:'🧑‍🌾',kind:'npc'},{x:55,y:24,t:'🧬',kind:'quiz'},{x:17,y:66,t:'💎',kind:'crystal'},{x:38,y:30,t:'🪙',kind:'coin'},{x:70,y:72,t:'🪙',kind:'coin'}],
[{x:25,y:35,t:'🍎',kind:'quiz'},{x:50,y:48,t:'🏆',kind:'quiz'},{x:75,y:35,t:'🥚',kind:'quiz'},{x:82,y:64,t:'💎',kind:'crystal'},{x:37,y:67,t:'💎',kind:'crystal'},{x:62,y:68,t:'👨‍🍳',kind:'npc'},{x:18,y:55,t:'🪙',kind:'coin'},{x:68,y:25,t:'🪙',kind:'coin'}],
[{x:31,y:43,t:'🥦',kind:'quiz'},{x:58,y:39,t:'💡',kind:'quiz'},{x:76,y:58,t:'👩‍🔬',kind:'npc'},{x:48,y:69,t:'⭐',kind:'reward'},{x:20,y:65,t:'🪙',kind:'coin'},{x:84,y:30,t:'🪙',kind:'coin'}],
[{x:51,y:38,t:'🌿',kind:'portal'}]];
let completed=new Set();
function select(c){char=c;$$('.choice').forEach(e=>e.classList.toggle('sel',e.dataset.char===c))}$$('.choice').forEach(e=>e.onclick=()=>select(e.dataset.char));
function sprite(){return `assets/${char}_${dir}_${frame%4}.png`}
function updatePlayer(){ $('#player').src=sprite();$('#player').style.left=x+'%';$('#player').style.top=y+'%';$('#name').textContent=char==='theo'?'Theo':'Maya';$('#avatar').src=char==='theo'?'assets/theo_full.png':'assets/maya_full.png'; checkNear() }
function loadZone(i){zoneIndex=i;$('#scene').style.backgroundImage=`url(${zones[i].bg})`;$('#zone').textContent=zones[i].name;x=50;y=75;renderObjects();renderMapbar();updatePlayer();tone(420,.08)}
function renderMapbar(){let b=$('#mapbar');b.innerHTML='';zones.forEach((z,i)=>{let bt=document.createElement('button');bt.textContent=z.name;bt.className=i===zoneIndex?'active':'';bt.onclick=()=>loadZone(i);b.appendChild(bt)})}
function renderObjects(){let box=$('#objects');box.innerHTML='';objectSets[zoneIndex].forEach((o,i)=>{let d=document.createElement('div');d.className='object '+(o.kind==='coin'?'coinobj ':'')+(completed.has(zoneIndex+'-'+i)?' done':'');d.style.left=o.x+'%';d.style.top=o.y+'%';d.textContent=o.t;d.dataset.i=i;box.appendChild(d)})}
function move(dx,dy,d){dir=d;let speed=running?2.2:1.25;x=Math.max(4,Math.min(96,x+dx*speed));y=Math.max(12,Math.min(91,y+dy*speed));frame++;$('#player').classList.add('walking');updatePlayer();clearTimeout(move.t);move.t=setTimeout(()=>$('#player').classList.remove('walking'),120)}
function checkNear(){near=null;objectSets[zoneIndex].forEach((o,i)=>{if(completed.has(zoneIndex+'-'+i))return;let dist=Math.hypot(x-o.x,y-o.y);if(dist<9)near={...o,i}});$('#prompt').style.display=near?'block':'none'}
function interact(){if(!near){toast('Chegue mais perto de um ponto de interação.');return}let key=zoneIndex+'-'+near.i;if(near.kind==='coin'){completed.add(key);coins+=1;tone(980,.08);coinBurst(near.x,near.y);toast('🪙 Moeda coletada! +1');refresh();renderObjects();return}if(near.kind==='crystal'){completed.add(key);crystals++;coins+=3;tone(880,.12);toast('💎 Cristal coletado! +3 estrelas');refresh();renderObjects();return}if(near.kind==='reward'){completed.add(key);coins+=5;tone(1040,.18);toast('⭐ Recompensa! +5 estrelas');refresh();renderObjects();return}if(near.kind==='npc'){completed.add(key);coins+=2;tone(620,.1);toast(zoneIndex===0?'🧑‍🌾 Dica: quanto mais cores naturais no prato, maior a variedade de nutrientes. +2':'💬 Personagem: explore os desafios e faça escolhas alimentares conscientes. +2');refresh();renderObjects();return}if(near.kind==='portal'){if(solved>=6){showQuestion(true)}else toast('✨ O portal pede pelo menos 6 desafios concluídos.');return}showQuestion(false,key)}
function showQuestion(final=false,key=''){let q=final?['Portal Master Fértil','Você concluiu a jornada! O que representa melhor o aprendizado?',['Escolhas variadas, equilibradas e conscientes','Comer sempre a mesma coisa','Ignorar hidratação'],0]:questions[solved%questions.length];$('#qtitle').textContent=q[0];$('#qtext').textContent=q[1];let a=$('#answers');a.innerHTML='';q[2].forEach((txt,i)=>{let b=document.createElement('button');b.textContent=txt;b.onclick=()=>{if(i===q[3]){tone(760,.16);if(!final){completed.add(key);solved++;coins+=5;refresh();renderObjects();b.textContent='✓ Correto! +5 estrelas';$$('#answers button').forEach(z=>z.disabled=true);$('#closeModal').classList.remove('hidden')}else{coins+=10;refresh();b.textContent='🏆 Mestre Fértil! +10 estrelas';$$('#answers button').forEach(z=>z.disabled=true);$('#closeModal').classList.remove('hidden')}}else{tone(180,.18);b.textContent='Tente outra vez';}};a.appendChild(b)});$('#modal').classList.remove('hidden')}
function coinBurst(cx,cy){let e=document.createElement('div');e.className='coinpop';e.textContent='+1 🪙';e.style.left=cx+'%';e.style.top=cy+'%';$('#game').appendChild(e);setTimeout(()=>e.remove(),900)}
function refresh(){$('#coins').textContent=coins;$('#progress').textContent=`Desafios ${solved}/8 • Cristais ${crystals}/5`}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function tone(freq,dur){if(!soundOn)return;try{const A=window.AudioContext||window.webkitAudioContext;window.ac=window.ac||new A();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
function startAmbient(){if(audioStarted)return;audioStarted=true;try{const A=window.AudioContext||window.webkitAudioContext;window.ac=window.ac||new A();let g=ac.createGain();g.gain.value=.025;g.connect(ac.destination);[196,246.94,293.66].forEach((f,j)=>{let o=ac.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start();setInterval(()=>{if(soundOn)o.frequency.setTargetAtTime(f*(1+[0,.125,.25,.5][Math.floor(Math.random()*4)]),ac.currentTime,.6)},2400+j*300)})}catch(e){}}
$('#go').onclick=()=>{$('#start').classList.add('hidden');$('#game').classList.remove('hidden');loadZone(0);startAmbient();tone(520,.12)};$('#interact').onclick=interact;$('#run').onclick=()=>{running=!running;$('#run').style.outline=running?'4px solid #ffd34e':''};$('#sound').onclick=()=>{soundOn=!soundOn;$('#sound').textContent=soundOn?'🔊':'🔇';if(soundOn)tone(600,.1)};$('#closeModal').onclick=()=>{$('#modal').classList.add('hidden');$('#closeModal').classList.add('hidden');if(zoneIndex===3)toast('🏆 Jornada concluída! Você é Master Fértil!')};
const keymap={ArrowUp:[0,-1,'up'],w:[0,-1,'up'],W:[0,-1,'up'],ArrowDown:[0,1,'down'],s:[0,1,'down'],S:[0,1,'down'],ArrowLeft:[-1,0,'left'],a:[-1,0,'left'],A:[-1,0,'left'],ArrowRight:[1,0,'right'],d:[1,0,'right'],D:[1,0,'right']};window.addEventListener('keydown',e=>{if(keymap[e.key]){e.preventDefault();keys.add(e.key)}if((e.key==='e'||e.key==='E'||e.key==='Enter')&&!e.repeat)interact();if(e.key==='Shift')running=true});window.addEventListener('keyup',e=>{keys.delete(e.key);if(e.key==='Shift')running=false});function gameLoop(now){let dt=Math.min(32,now-last);last=now;let v=running?.020:.012,dx=0,dy=0,nd=dir;for(let k of keys){let m=keymap[k];if(!m)continue;dx+=m[0];dy+=m[1];nd=m[2]}if(dx||dy){let len=Math.hypot(dx,dy)||1;x=Math.max(4,Math.min(96,x+dx/len*v*dt));y=Math.max(12,Math.min(91,y+dy/len*v*dt));dir=nd;walkAcc+=dt;if(walkAcc>120){frame=(frame+1)%4;walkAcc=0}$('#player').classList.add('walking');updatePlayer()}else $('#player').classList.remove('walking');requestAnimationFrame(gameLoop)}requestAnimationFrame(gameLoop);
$$('.pad button').forEach(b=>{let timer;const go=()=>{let d=b.dataset.dir,vals={up:[0,-1,'up'],down:[0,1,'down'],left:[-1,0,'left'],right:[1,0,'right']}[d];move(...vals);timer=setInterval(()=>move(...vals),70)};const stop=()=>clearInterval(timer);b.onpointerdown=go;b.onpointerup=stop;b.onpointerleave=stop});
// edge travel between worlds
setInterval(()=>{if(x>94&&zoneIndex<3){loadZone(zoneIndex+1);x=8;toast('Novo local desbloqueado!')}else if(x<5&&zoneIndex>0){loadZone(zoneIndex-1);x=92}},250);
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
